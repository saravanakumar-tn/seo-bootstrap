# Copy to .github/workflows/seo.yml in ANY website repo.
# Runs on demand, and weekly so new problems (e.g. a sitemap that broke) turn into issues.
name: SEO setup

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1' # Mondays 03:17 UTC

permissions:
  contents: read
  issues: write

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: seo
        uses: saravanakumar-tn/seo-bootstrap@v0
        with:
          config: seo.config.json # see seo.config.example.json in the seo-bootstrap repo
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GA_ACCOUNT_ID: ${{ vars.GA_ACCOUNT_ID }}
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Optional: use the GA4 measurement ID in your build
      - run: echo "GA4 = ${{ steps.seo.outputs.measurement_id }}"
